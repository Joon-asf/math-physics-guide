<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Physics Society Guidebook</title>
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="initKaTeX()"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f3f3;
            margin: 0;
            padding: 20px;
            color: #2c2c2c;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(122, 28, 41, 0.12);
            border-top: 6px solid #7A1C29;
        }
        .screen { display: none; }
        .active { display: block; }

        .btn {
            background-color: #7A1C29;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px 5px 6px 0;
            transition: background 0.2s;
            text-align: left;
            width: 100%;
        }
        .btn:hover { background-color: #5c141e; }
        .btn-subject { font-size: 18px; text-align: center; }
        .btn-back { background-color: #555555; text-align: center; width: auto; }
        .btn-back:hover { background-color: #333333; }

        .login-box { max-width: 350px; margin: 40px auto; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #7A1C29; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .error-msg { color: #dc3545; display: none; margin-top: 10px; font-size: 14px; }
        
        .summary-card {
            background: #fdfafb;
            border-left: 5px solid #7A1C29;
            padding: 24px;
            margin-top: 20px;
            border-radius: 6px;
            line-height: 1.7;
        }
        .summary-card h3 { color: #7A1C29; margin-top: 0; border-bottom: 2px solid #f0d8dc; padding-bottom: 8px; }
        .summary-card h4 { margin-top: 22px; margin-bottom: 8px; color: #7A1C29; font-size: 16px; border-left: 3px solid #D4AF37; padding-left: 8px; }
        .summary-card p { margin-top: 5px; color: #444; }
        .summary-card ul, .summary-card ol { padding-left: 20px; margin-top: 5px; color: #444; }
        
        .symbol-box {
            background-color: #fcf8f3;
            border: 1px solid #f3e5d0;
            border-radius: 6px;
            padding: 12px 15px;
            margin: 10px 0 15px 0;
            font-size: 14px;
        }
        .symbol-box strong { color: #7A1C29; }

        .exam-tip {
            background-color: #fff8e6;
            border: 1px solid #D4AF37;
            color: #665000;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="screen-login" class="screen active">
        <div class="login-box">
            <h2>🔒 Member Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-subject" style="width: 100%;">Sign In</button>
                <p id="login-error" class="error-msg">Invalid Username or Password.</p>
            </form>
        </div>
    </div>

    <div id="screen-subject" class="screen">
        <h2>📚 Select Course</h2>
        <p>Select a course syllabus to review key concepts, formulas, and symbol breakdowns.</p>
        <button class="btn btn-subject" onclick="selectSubject('calc')">📐 AP Calculus AB</button>
        <button class="btn btn-subject" onclick="selectSubject('physics')">⚡ AP Physics C: Mechanics</button>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="logout()">Log Out</button>
        </div>
    </div>

    <div id="screen-unit" class="screen">
        <h2 id="subject-title">Subject Title</h2>
        <p>Select a Unit from the syllabus:</p>
        <div id="unit-buttons"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-subject')">← Back to Courses</button>
        </div>
    </div>

    <div id="screen-summary" class="screen">
        <h2 id="summary-title">Unit Summary</h2>
        <div id="summary-content" class="summary-card"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-unit')">← Back to Syllabus Units</button>
        </div>
    </div>

</div>

<script>
    function initKaTeX() {
        if (typeof renderMathInElement === "function") {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('username').value.trim();
        const pw = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('login-error');

        if (id === "MathPhysicsSociety" && pw === "asf123") {
            errorMsg.style.display = "none";
            showScreen('screen-subject');
        } else {
            errorMsg.style.display = "block";
        }
    });

    function logout() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('screen-login');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    let currentSubject = '';

    function selectSubject(subject) {
        currentSubject = subject;
        const unitContainer = document.getElementById('unit-buttons');
        unitContainer.innerHTML = '';

        if (subject === 'calc') {
            document.getElementById('subject-title').innerText = "📐 AP Calculus AB";
            const units = [
                "Unit 1: Limits and Continuity",
                "Unit 2: Differentiation, definition and rules",
                "Unit 3: Differentiating composite and inverse functions",
                "Unit 4: Contextual applications of differentiation",
                "Unit 5: Applying derivatives to analyze functions",
                "Unit 6: Integration and Accumulation of Change",
                "Unit 7: Differential Equations",
                "Unit 8: Applications of integration",
                "Unit 9: Course review and exam preparation"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('calc', ${index + 1})">${u}</button>`;
            });
        } else if (subject === 'physics') {
            document.getElementById('subject-title').innerText = "⚡ AP Physics C: Mechanics";
            const units = [
                "Unit 1: Kinematics",
                "Unit 2: Force and Dynamics",
                "Unit 3: Work, Energy and Power",
                "Unit 4: Linear Momentum",
                "Unit 5: Torque and Rotational Dynamics",
                "Unit 6: Energy and Momentum of Rotating Systems",
                "Unit 7: Oscillations"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('physics', ${index + 1})">${u}</button>`;
            });
        }
        showScreen('screen-unit');
    }

    const calcData = {
        1: `<h3>Unit 1: Limits and Continuity</h3>
            <h4>📌 Unit Overview</h4>
            <p>This foundational unit introduces <strong>Limits</strong> and <strong>Continuity</strong>. You will explore how functions behave as inputs approach specific points (even when undefined) and establish formal rules to check if a function has no breaks or jumps.</p>

            <h4>1. Existence of Limits</h4>
            <p>$$\\lim_{x \\to c^-} f(x) = \\lim_{x \\to c^+} f(x) = L \\iff \\lim_{x \\to c} f(x) = L$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$x \\to c^-$ : Left-hand limit ($x$ approaches $c$ from values smaller than $c$)</li>
                    <li>$x \\to c^+$ : Right-hand limit ($x$ approaches $c$ from values larger than $c$)</li>
                    <li>$L$ : The target y-value (Limit value) reached when both side limits match</li>
                </ul>
            </div>

            <h4>2. Continuity (3-Part Checklist)</h4>
            <p>A function $f(x)$ is continuous at $x = c$ if and only if:</p>
            <ol>
                <li>$f(c)$ is defined.</li>
                <li>$\\lim_{x \\to c} f(x)$ exists.</li>
                <li>$\\lim_{x \\to c} f(x) = f(c)$.</li>
            </ol>

            <h4>3. Intermediate Value Theorem (IVT)</h4>
            <p>If $f(x)$ is continuous on $[a,b]$, it must take on every value between $f(a)$ and $f(b)$ at least once.</p>
            <div class="exam-tip"><strong>🎯 AP Exam Tip:</strong> On FRQs, always write <em>"Since $f(x)$ is continuous on $[a,b]$..."</em> before invoking the IVT to earn full credit.</div>`,

        2: `<h3>Unit 2: Differentiation: Definition and Rules</h3>
            <h4>📌 Unit Overview</h4>
            <p>This unit defines the <strong>derivative</strong> as an instantaneous rate of change or the slope of a tangent line. You will master shortcut rules to quickly differentiate polynomial, product, and quotient expressions.</p>

            <h4>1. Limit Definition of Derivative</h4>
            <p>$$f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$f'(x)$ : Derivative of $f(x)$ (Instantaneous rate of change / Tangent slope)</li>
                    <li>$h$ : The horizontal distance between two points ($\Delta x$), approaching zero</li>
                    <li>$f(x+h) - f(x)$ : The vertical change ($\Delta y$)</li>
                </ul>
            </div>

            <h4>2. Basic Differentiation Rules</h4>
            <p><strong>Power Rule:</strong> $\\frac{d}{dx}[x^n] = n x^{n-1}$</p>
            <p><strong>Product Rule:</strong> $\\frac{d}{dx}[u \\cdot v] = u'v + uv'$</p>
            <p><strong>Quotient Rule:</strong> $\\frac{d}{dx}\\left[\\frac{u}{v}\\right] = \\frac{u'v - uv'}{v^2}$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\frac{d}{dx}$ : Differential operator ("take derivative with respect to $x$")</li>
                    <li>$n$ : Any real number exponent</li>
                    <li>$u, v$ : Differentiable functions of $x$</li>
                </ul>
            </div>`,

        3: `<h3>Unit 3: Composite, Implicit & Inverse Functions</h3>
            <h4>📌 Unit Overview</h4>
            <p>Learn techniques to differentiate complex structures such as nested functions (Chain Rule), implicit equations where $x$ and $y$ are intertwined, and inverse functions.</p>

            <h4>1. Chain Rule</h4>
            <p>$$\\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$f(g(x))$ : Composite function where $g(x)$ is inside $f(x)$</li>
                    <li>$f'(g(x))$ : Derivative of outer function evaluated at the unmodified inner function</li>
                    <li>$g'(x)$ : Derivative of inner function multiplied at the end</li>
                </ul>
            </div>

            <h4>2. Derivative of Inverse Functions</h4>
            <p>$$(f^{-1})'(a) = \\frac{1}{f'(f^{-1}(a))}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$f^{-1}$ : Inverse function of $f$</li>
                    <li>$a$ : Input of inverse function (which equals output $y$ of original function $f$)</li>
                </ul>
            </div>`,

        4: `<h3>Unit 4: Contextual Applications of Differentiation</h3>
            <h4>📌 Unit Overview</h4>
            <p>Apply derivatives to real-world contexts, including 1D particle motion (position, velocity, acceleration) and Related Rates problems involving geometric shapes changing over time.</p>

            <h4>1. Motion Variables</h4>
            <p>$$v(t) = s'(t), \\quad a(t) = v'(t) = s''(t)$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$s(t)$ or $x(t)$ : Position function at time $t$</li>
                    <li>$v(t)$ : Velocity function at time $t$ (vector: has direction and sign)</li>
                    <li>$a(t)$ : Acceleration function at time $t$</li>
                    <li>$|v(t)|$ : Speed (scalar). Speed increases when $v(t)$ and $a(t)$ have the <strong>same sign</strong>!</li>
                </ul>
            </div>`,

        5: `<h3>Unit 5: Applying Derivatives to Analyze Functions</h3>
            <h4>📌 Unit Overview</h4>
            <p>Analyze $f'$ and $f''$ to determine critical points, relative/absolute extrema, intervals of increase/decrease, concavity, points of inflection, and solve optimization problems.</p>

            <h4>Key Analytical Rules</h4>
            <ul>
                <li>$f'(x) > 0 \\implies f(x)$ is Increasing</li>
                <li>$f'(x) < 0 \\implies f(x)$ is Decreasing</li>
                <li>$f''(x) > 0 \\implies f(x)$ is Concave Up</li>
                <li>$f''(x) < 0 \\implies f(x)$ is Concave Down</li>
            </ul>`,

        6: `<h3>Unit 6: Integration and Accumulation of Change</h3>
            <h4>📌 Overview</h4>
            <p>Introduction to Integration (antidifferentiation) to find the net signed area bounded by curves, connected via the Fundamental Theorem of Calculus.</p>

            <h4>1. Fundamental Theorem of Calculus (FTC)</h4>
            <p>$$\\int_{a}^{b} f(x) dx = F(b) - F(a)$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\int_{a}^{b}$ : Definite integral from lower bound $a$ to upper bound $b$</li>
                    <li>$f(x)$ : Integrand (function being integrated)</li>
                    <li>$dx$ : Infinitesimal width along the x-axis</li>
                    <li>$F(x)$ : Antiderivative of $f(x)$ such that $F'(x) = f(x)$</li>
                </ul>
            </div>`,

        7: `<h3>Unit 7: Differential Equations</h3>
            <h4>📌 Unit Overview</h4>
            <p>Solve differential equations containing $\\frac{dy}{dx}$ using Separation of Variables to model population dynamics and exponential growth or decay.</p>

            <h4>Exponential Growth / Decay</h4>
            <p>$$\\frac{dy}{dt} = ky \\implies y(t) = y_0 e^{kt}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$y_0$ : Initial quantity at $t=0$</li>
                    <li>$k$ : Proportionality rate constant ($k>0$ growth, $k<0$ decay)</li>
                    <li>$e$ : Euler's constant ($\approx 2.71828$)</li>
                </ul>
            </div>`,

        8: `<h3>Unit 8: Applications of Integration</h3>
            <h4>📌 Unit Overview</h4>
            <p>Utilize definite integrals to calculate areas between curves and volumes of 3D solids using the Disc and Washer methods.</p>

            <h4>Disc Method Volume</h4>
            <p>$$V = \\pi \\int_{a}^{b} [R(x)]^2 dx$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$V$ : Total volume of the solid of revolution</li>
                    <li>$R(x)$ : Radius function from axis of rotation to curve edge</li>
                </ul>
            </div>`,

        9: `<h3>Unit 9: Course Review and Exam Preparation</h3>
            <h4>📌 Unit Overview</h4>
            <p>Final preparation unit for the AP Calculus AB exam covering full-length FRQ rubric guidelines, error avoidance, and graphing calculator strategies.</p>`
    };

    const physicsData = {
        1: `<h3>Unit 1: Kinematics</h3>
            <h4>📌 Unit Overview</h4>
            <p>Describes motion using calculus. In AP Physics C, acceleration is often time-dependent, requiring integration and differentiation between position, velocity, and acceleration vectors.</p>

            <h4>Calculus Relations</h4>
            <p>$$v(t) = \\frac{dx}{dt}, \\quad a(t) = \\frac{dv}{dt} = \\frac{d^2x}{dt^2}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$x(t)$ : Position vector as a function of time $t$</li>
                    <li>$v(t)$ : Instantaneous velocity</li>
                    <li>$a(t)$ : Instantaneous acceleration</li>
                    <li>$\\frac{d^2x}{dt^2}$ : Second derivative of position with respect to time</li>
                </ul>
            </div>`,

        2: `<h3>Unit 2: Force and Dynamics</h3>
            <h4>📌 Unit Overview</h4>
            <p>Covers Newton's Laws of Motion, drag forces in fluids leading to terminal velocity, and differential equations derived from $\\sum \\vec{F} = m\\vec{a}$.</p>

            <h4>Newton's Second Law</h4>
            <p>$$\\vec{F}_{net} = \\frac{d\\vec{p}}{dt} = m\\vec{a}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\vec{F}_{net}$ : Net vector sum of all external forces acting on mass $m$</li>
                    <li>$\\vec{p}$ : Linear momentum vector ($\\vec{p} = m\\vec{v}$)</li>
                    <li>$m$ : Mass of the object</li>
                    <li>$\\vec{a}$ : Acceleration vector</li>
                </ul>
            </div>`,

        3: `<h3>Unit 3: Work, Energy and Power</h3>
            <h4>📌 Unit Overview</h4>
            <p>Explores work done by variable forces via line integrals, conservation of mechanical energy, potential energy curves, and conservative force gradients.</p>

            <h4>Work & Potential Energy</h4>
            <p>$$W = \\int_{x_1}^{x_2} F(x) dx, \\quad F(x) = -\\frac{dU}{dx}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$W$ : Work done by force $F$ (Joules)</li>
                    <li>$F(x)$ : Variable force as a function of position $x$</li>
                    <li>$U(x)$ : Potential Energy. Forces act in the direction of decreasing potential energy ($-$ sign)</li>
                </ul>
            </div>`,

        4: `<h3>Unit 4: Linear Momentum</h3>
            <h4>📌 Unit Overview</h4>
            <p>Covers impulse-momentum theory, elastic vs. inelastic collisions in 1D/2D, and calculating Center of Mass for continuous rigid bodies using integration.</p>

            <h4>Impulse & Center of Mass</h4>
            <p>$$\\vec{J} = \\int \\vec{F} dt = \\Delta \\vec{p}, \\quad x_{cm} = \\frac{1}{M} \\int x dm$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\vec{J}$ : Impulse (Area under Force vs. Time curve)</li>
                    <li>$\\Delta \\vec{p}$ : Change in linear momentum ($\\vec{p}_f - \\vec{p}_i$)</li>
                    <li>$x_{cm}$ : X-coordinate of Center of Mass</li>
                    <li>$M$ : Total system mass ($\\int dm$)</li>
                    <li>$dm$ : Infinitesimal mass element</li>
                </ul>
            </div>`,

        5: `<h3>Unit 5: Torque and Rotational Dynamics</h3>
            <h4>📌 Unit Overview</h4>
            <p>Introduces rotational counterparts of force and mass: Torque ($\\vec{\\tau}$), Moment of Inertia ($I$), and rotational Newton's 2nd Law ($\\tau = I\\alpha$).</p>

            <h4>Torque & Moment of Inertia</h4>
            <p>$$\\vec{\\tau} = \\vec{r} \\times \\vec{F}, \\quad \\tau_{net} = I \\alpha, \\quad I = \\int r^2 dm$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\vec{\\tau}$ (tau) : Torque (rotational force vector)</li>
                    <li>$\\vec{r}$ : Position vector from axis of rotation to point of force application</li>
                    <li>$I$ : Moment of inertia (rotational mass/resistance to rotation)</li>
                    <li>$\\alpha$ (alpha) : Angular acceleration ($\\frac{d\\omega}{dt}$)</li>
                    <li>$r$ : Perpendicular distance from rotational axis to mass element $dm$</li>
                </ul>
            </div>`,

        6: `<h3>Unit 6: Energy and Momentum of Rotating Systems</h3>
            <h4>📌 Unit Overview</h4>
            <p>Analyzes rolling motion without slipping (combining translational + rotational kinetic energy) and Conservation of Angular Momentum ($L$).</p>

            <h4>Angular Momentum</h4>
            <p>$$L = I \\omega, \\quad \\vec{L} = \\vec{r} \\times \\vec{p}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$L$ : Angular momentum</li>
                    <li>$\\omega$ (omega) : Angular velocity ($\text{rad/s}$)</li>
                    <li>$\\vec{p}$ : Linear momentum ($m\\vec{v}$)</li>
                </ul>
            </div>`,

        7: `<h3>Unit 7: Oscillations</h3>
            <h4>📌 Unit Overview</h4>
            <p>Studies Simple Harmonic Motion (SHM) for mass-spring systems and physical pendulums modeled by second-order differential equations.</p>

            <h4>Simple Harmonic Motion Equation</h4>
            <p>$$\\frac{d^2x}{dt^2} + \\omega^2 x = 0 \\implies T = 2\\pi \\sqrt{\\frac{m}{k}}$$</p>
            <div class="symbol-box">
                <strong>🔍 Symbol Key:</strong>
                <ul>
                    <li>$\\omega$ : Natural angular frequency ($\\omega = \\sqrt{\\frac{k}{m}}$)</li>
                    <li>$T$ : Period (time required for 1 full cycle)</li>
                    <li>$k$ : Spring constant</li>
                    <li>$m$ : Mass attached to oscillator</li>
                </ul>
            </div>`
    };

    function showSummary(subject, unitNum) {
        const titleEl = document.getElementById('summary-title');
        const contentEl = document.getElementById('summary-content');

        if (subject === 'calc') {
            titleEl.innerText = `AP Calculus AB - Unit ${unitNum}`;
            contentEl.innerHTML = calcData[unitNum] || "<p>Content updating...</p>";
        } else if (subject === 'physics') {
            titleEl.innerText = `AP Physics C - Unit ${unitNum}`;
            contentEl.innerHTML = physicsData[unitNum] || "<p>Content updating...</p>";
        }

        showScreen('screen-summary');
        
        setTimeout(() => {
            initKaTeX();
        }, 50);
    }
</script>

</body>
</html>
