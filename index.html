<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Physics Society Guidebook</title>
    
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="initKaTeX()"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .screen { display: none; }
        .active { display: block; }

        .btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px 5px 6px 0;
            transition: background 0.2s;
            text-align: left;
            width: 100%;
        }
        .btn:hover { background-color: #004b99; }
        .btn-subject { font-size: 18px; text-align: center; }
        .btn-back { background-color: #6c757d; text-align: center; width: auto; }
        .btn-back:hover { background-color: #5a6268; }

        .login-box { max-width: 350px; margin: 40px auto; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .error-msg { color: #dc3545; display: none; margin-top: 10px; font-size: 14px; }
        
        .summary-card {
            background: #f8f9fa;
            border-left: 5px solid #0066cc;
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
            line-height: 1.7;
        }
        .summary-card h3 { color: #0066cc; margin-top: 0; border-bottom: 2px solid #e0e0e0; padding-bottom: 8px; }
        .summary-card h4 { margin-top: 20px; margin-bottom: 5px; color: #111; font-size: 16px; }
        .summary-card p { margin-top: 5px; color: #444; }
        .summary-card ul, .summary-card ol { padding-left: 20px; margin-top: 5px; color: #444; }
        .exam-tip {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Login Screen -->
    <div id="screen-login" class="screen active">
        <div class="login-box">
            <h2>🔒 Member Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-subject" style="width: 100%;">Sign In</button>
                <p id="login-error" class="error-msg">Invalid Username or Password.</p>
            </form>
        </div>
    </div>

    <!-- 2. Subject Selection Screen -->
    <div id="screen-subject" class="screen">
        <h2>📚 Select Course</h2>
        <p>Select a course syllabus to review key concepts & formulas.</p>
        <button class="btn btn-subject" onclick="selectSubject('calc')">📐 AP Calculus AB</button>
        <button class="btn btn-subject" onclick="selectSubject('physics')">⚡ AP Physics C: Mechanics</button>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- 3. Unit Selection Screen -->
    <div id="screen-unit" class="screen">
        <h2 id="subject-title">Subject Title</h2>
        <p>Select a Unit from syllabus:</p>
        <div id="unit-buttons"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-subject')">← Back to Courses</button>
        </div>
    </div>

    <!-- 4. Summary Screen -->
    <div id="screen-summary" class="screen">
        <h2 id="summary-title">Unit Summary</h2>
        <div id="summary-content" class="summary-card"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-unit')">← Back to Syllabus Units</button>
        </div>
    </div>

</div>

<script>
    function initKaTeX() {
        if (typeof renderMathInElement === "function") {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('username').value.trim();
        const pw = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('login-error');

        if (id === "MathPhysicsSociety" && pw === "asf123") {
            errorMsg.style.display = "none";
            showScreen('screen-subject');
        } else {
            errorMsg.style.display = "block";
        }
    });

    function logout() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('screen-login');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    let currentSubject = '';

    function selectSubject(subject) {
        currentSubject = subject;
        const unitContainer = document.getElementById('unit-buttons');
        unitContainer.innerHTML = '';

        if (subject === 'calc') {
            document.getElementById('subject-title').innerText = "📐 AP Calculus AB";
            const units = [
                "Unit 1: Limits and Continuity",
                "Unit 2: Differentiation, definition and rules",
                "Unit 3: Differentiating composite and inverse functions",
                "Unit 4: Contextual applications of differentiation",
                "Unit 5: Applying derivatives to analyze functions",
                "Unit 6: Integration and Accumulation of Change",
                "Unit 7: Differential Equations",
                "Unit 8: Applications of integration",
                "Unit 9: Course review and exam preparation"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('calc', ${index + 1})">${u}</button>`;
            });
        } else if (subject === 'physics') {
            document.getElementById('subject-title').innerText = "⚡ AP Physics C: Mechanics";
            const units = [
                "Unit 1: Kinematics",
                "Unit 2: Force and Dynamics",
                "Unit 3: Work, Energy and Power",
                "Unit 4: Linear Momentum",
                "Unit 5: Torque and Rotational Dynamics",
                "Unit 6: Energy and Momentum of Rotating Systems",
                "Unit 7: Oscillations"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('physics', ${index + 1})">${u}</button>`;
            });
        }
        showScreen('screen-unit');
    }

    const calcData = {
        1: `<h3>Unit 1: Limits and Continuity</h3>
            <h4>💡 Core Concept</h4>
            <p>Calculus begins with understanding behavior near a point. A <strong>limit</strong> describes the value a function approaches as input values get arbitrarily close to a specific value, even if the function doesn't exist at that exact point.</p>
            <h4>1. Existence of Limits</h4>
            <p>$$\\lim_{x \\to c^-} f(x) = \\lim_{x \\to c^+} f(x) = L \\iff \\lim_{x \\to c} f(x) = L$$</p>
            <h4>2. Continuity (The 3-Part Checklist)</h4>
            <ul>
                <li>$f(c)$ is defined.</li>
                <li>$\\lim_{x \\to c} f(x)$ exists.</li>
                <li>$\\lim_{x \\to c} f(x) = f(c)$.</li>
            </ul>
            <h4>3. Intermediate Value Theorem (IVT)</h4>
            <p>If $f(x)$ is continuous on $[a, b]$, it must hit every intermediate value between $f(a)$ and $f(b)$.</p>
            <div class="exam-tip"><strong>🎯 AP Exam Strategy:</strong> On Free Response Questions, state <em>"Since $f(x)$ is continuous on $[a,b]$..."</em> before applying IVT.</div>`,

        2: `<h3>Unit 2: Differentiation: Definition and Rules</h3>
            <h4>💡 Core Concept</h4>
            <p>The <strong>derivative</strong> represents the instantaneous rate of change of a function, or the slope of the tangent line to the curve at a given point.</p>
            <h4>1. Limit Definition of Derivative</h4>
            <p>$$f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$$</p>
            <h4>2. Differentiation Rules</h4>
            <ul>
                <li><strong>Power Rule:</strong> $\\frac{d}{dx}[x^n] = n x^{n-1}$</li>
                <li><strong>Product Rule:</strong> $\\frac{d}{dx}[uv] = u'v + uv'$</li>
                <li><strong>Quotient Rule:</strong> $\\frac{d}{dx}\\left[\\frac{u}{v}\\right] = \\frac{u'v - uv'}{v^2}$</li>
            </ul>`,

        3: `<h3>Unit 3: Composite, Implicit & Inverse Functions</h3>
            <h4>💡 Core Concept</h4>
            <p>Real-world functions are often nested inside one another or defined implicitly ($x$ and $y$ mixed together).</p>
            <h4>1. Chain Rule</h4>
            <p>$$\\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)$$</p>
            <h4>2. Implicit Differentiation</h4>
            <p>Differentiate both sides with respect to $x$, applying the Chain Rule to $y$ terms by appending $\\frac{dy}{dx}$.</p>
            <h4>3. Inverse Function Derivative</h4>
            <p>$$(f^{-1})'(a) = \\frac{1}{f'(f^{-1}(a))}$$</p>`,

        4: `<h3>Unit 4: Contextual Applications of Differentiation</h3>
            <h4>💡 Core Concept</h4>
            <p>Derivatives explain how quantities change over time in real-world contexts, such as particle motion and related rates.</p>
            <h4>1. Particle Motion</h4>
            <p>Velocity: $v(t) = s'(t)$, Acceleration: $a(t) = v'(t)$. Speed increases when $v(t)$ and $a(t)$ have the <strong>same sign</strong>.</p>
            <h4>2. Related Rates</h4>
            <p>Differentiate geometric formulas with respect to time $t$ using the Chain Rule to find unknown rates.</p>`,

        5: `<h3>Unit 5: Applying Derivatives to Analyze Functions</h3>
            <h4>💡 Core Concept</h4>
            <p>Analyzing derivatives helps sketch graphs and determine maximum/minimum values for optimization problems.</p>
            <h4>1. Critical Points & Extrema</h4>
            <p>Critical points occur where $f'(x) = 0$ or is undefined. $f'(x) > 0 \\implies$ Increasing, $f''(x) > 0 \\implies$ Concave Up.</p>`,

        6: `<h3>Unit 6: Integration and Accumulation of Change</h3>
            <h4>💡 Core Concept</h4>
            <p>Integration accumulates change and calculates the net area under a curve.</p>
            <h4>1. Fundamental Theorem of Calculus (FTC)</h4>
            <p>Part 1: $\\frac{d}{dx} \\int_{a}^{x} f(t) dt = f(x)$ | Part 2: $\\int_{a}^{b} f(x) dx = F(b) - F(a)$</p>`,

        7: `<h3>Unit 7: Differential Equations</h3>
            <h4>💡 Core Concept</h4>
            <p>Equations linking a function to its derivative. Solved via separation of variables.</p>
            <p>$$\\frac{dy}{dt} = ky \\implies y(t) = y_0 e^{kt}$$</p>`,

        8: `<h3>Unit 8: Applications of Integration</h3>
            <h4>💡 Core Concept</h4>
            <p>Integrals calculate area between curves and volumes of 3D solids.</p>
            <p>Disc: $V = \\pi \\int [R(x)]^2 dx$ | Washer: $V = \\pi \\int ([R(x)]^2 - [r(x)]^2) dx$</p>`,

        9: `<h3>Unit 9: Course Review and Exam Preparation</h3>
            <h4>💡 AP Exam Prep</h4>
            <ul>
                <li>Verify prerequisites (continuity/differentiability) before using IVT or MVT.</li>
                <li>Do not round intermediate calculation steps on calculator sections.</li>
            </ul>`
    };

    const physicsData = {
        1: `<h3>Unit 1: Kinematics</h3>
            <h4>💡 Core Concept</h4>
            <p>Kinematics describes motion using calculus for variable acceleration.</p>
            <p>$$v(t) = \\frac{dx}{dt}, \\quad a(t) = \\frac{dv}{dt} = \\frac{d^2x}{dt^2}$$</p>`,
        2: `<h3>Unit 2: Force and Dynamics</h3>
            <h4>💡 Core Concept</h4>
            <p>$$\\vec{F}_{net} = \\frac{d\\vec{p}}{dt} = m\\vec{a}$$</p>
            <p>Terminal Velocity ($v_T$): $mg - bv_T = 0 \\implies v_T = \\frac{mg}{b}$.</p>`,
        3: `<h3>Unit 3: Work, Energy and Power</h3>
            <h4>💡 Core Concept</h4>
            <p>$$W = \\int_{x_1}^{x_2} F(x) dx, \\quad F(x) = -\\frac{dU}{dx}, \\quad P = \\vec{F} \\cdot \\vec{v}$$</p>`,
        4: `<h3>Unit 4: Linear Momentum</h3>
            <h4>💡 Core Concept</h4>
            <p>$$\\vec{J} = \\int \\vec{F} dt = \\Delta \\vec{p}, \\quad x_{cm} = \\frac{1}{M} \\int x dm$$</p>`,
        5: `<h3>Unit 5: Torque and Rotational Dynamics</h3>
            <h4>💡 Core Concept</h4>
            <p>$$\\vec{\\tau} = \\vec{r} \\times \\vec{F}, \\quad \\tau_{net} = I \\alpha, \\quad I = \\int r^2 dm$$</p>`,
        6: `<h3>Unit 6: Energy and Momentum of Rotating Systems</h3>
            <h4>💡 Core Concept</h4>
            <p>$$K_{rot} = \\frac{1}{2}I \\omega^2, \\quad L = I \\omega$$</p>`,
        7: `<h3>Unit 7: Oscillations</h3>
            <h4>💡 Core Concept</h4>
            <p>$$\\frac{d^2x}{dt^2} + \\omega^2 x = 0 \\implies T = 2\\pi \\sqrt{\\frac{m}{k}}$$</p>`
    };

    function showSummary(subject, unitNum) {
        const titleEl = document.getElementById('summary-title');
        const contentEl = document.getElementById('summary-content');

        if (subject === 'calc') {
            titleEl.innerText = `AP Calculus AB - Unit ${unitNum}`;
            contentEl.innerHTML = calcData[unitNum] || "<p>Content updating...</p>";
        } else if (subject === 'physics') {
            titleEl.innerText = `AP Physics C - Unit ${unitNum}`;
            contentEl.innerHTML = physicsData[unitNum] || "<p>Content updating...</p>";
        }

        showScreen('screen-summary');
        
        setTimeout(() => {
            initKaTeX();
        }, 50);
    }
</script>

</body>
</html>
