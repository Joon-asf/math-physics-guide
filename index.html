<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Physics Guidebook</title>
    
    <!-- KaTeX CSS & JS for Math Rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js" onload="initKaTeX()"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f7f3f3;
            margin: 0;
            padding: 20px;
            color: #2c2c2c;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }

        .screen { display: none; }
        .active { display: block; }

        h1, h2, h3 { color: #7A1C29; }
        
        .btn {
            background-color: #7A1C29;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px 5px 5px 0;
            transition: background 0.2s;
        }
        .btn:hover { background-color: #5c141e; }
        .btn-subject { font-size: 16px; text-align: left; width: 100%; margin-bottom: 10px; }
        .btn-back { background-color: #555; }
        .btn-action { background-color: #D4AF37; color: #2c2c2c; font-weight: bold; }
        .btn-action:hover { background-color: #b8952b; }

        .login-box { max-width: 380px; margin: 40px auto; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; color: #7A1C29; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        .summary-card {
            background: #fdfafb;
            border-left: 5px solid #7A1C29;
            padding: 20px;
            margin-top: 15px;
            border-radius: 6px;
            line-height: 1.7;
        }

        .symbol-key {
            background: #f0e6e8;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2c2c2c;
            color: white;
            padding: 10px 15px;
            border-radius: 6px;
            margin-bottom: 15px;
        }
        .option-btn {
            display: block;
            width: 100%;
            text-align: left;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }
        .option-btn.selected { border-color: #7A1C29; background: #f0e6e8; }

        .hint-box, .explanation-box {
            background: #eef7ff;
            border-left: 4px solid #007bff;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Login Screen -->
    <div id="screen-login" class="screen active">
        <div class="login-box">
            <h2>🔒 Member Login</h2>
            <form id="loginForm">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-subject" style="text-align:center;">Sign In</button>
                <p id="login-error" style="color:red; display:none; margin-top:10px;">Invalid credentials.</p>
            </form>
        </div>
    </div>

    <!-- 2. Subject Selection Screen -->
    <div id="screen-subject" class="screen">
        <h2>📚 Select Course</h2>
        <button class="btn btn-subject" onclick="selectSubject('calc')">📐 AP Calculus AB</button>
        <button class="btn btn-subject" onclick="selectSubject('physics')">⚡ AP Physics C: Mechanics</button>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- 3. Unit Selection Screen -->
    <div id="screen-unit" class="screen">
        <h2 id="subject-title">Subject Title</h2>
        <div id="unit-buttons"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-subject')">← Back to Courses</button>
        </div>
    </div>

    <!-- 4. Summary Screen -->
    <div id="screen-summary" class="screen">
        <h2 id="summary-title">Unit Summary</h2>
        <div style="margin-bottom: 15px;">
            <button class="btn btn-action" onclick="startPractice('MCQ')">📝 Practice MCQ</button>
            <button class="btn btn-action" onclick="startPractice('FRQ')">✍️ Practice FRQ</button>
        </div>
        <div id="summary-content" class="summary-card"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-unit')">← Back to Units</button>
        </div>
    </div>

    <!-- 5. Practice Screen -->
    <div id="screen-practice" class="screen">
        <div class="timer-bar">
            <div>
                <span id="practice-mode-label" style="font-weight: bold; color: #D4AF37;">MCQ Mode</span>
                <span id="question-progress" style="margin-left: 15px;">Question 1 of 2</span>
            </div>
            <div>⏱️ <span id="timer-display">00:00</span></div>
        </div>

        <div id="practice-body">
            <h3 id="q-title">Question 1</h3>
            <p id="q-text" style="font-size: 16px; line-height: 1.6;"></p>
            <div id="mcq-options-container"></div>

            <div style="margin-top: 20px;">
                <button class="btn btn-action" onclick="toggleHint()">💡 Hint</button>
                <button class="btn" onclick="checkAnswer()">Check Answer</button>
            </div>

            <div id="hint-card" class="hint-box"></div>
            <div id="explain-card" class="explanation-box"></div>

            <div style="margin-top: 25px; display: flex; justify-content: space-between;">
                <button class="btn btn-back" onclick="prevQuestion()" id="prev-btn">← Previous</button>
                <button class="btn" onclick="nextQuestion()" id="next-btn">Next →</button>
            </div>
        </div>
    </div>

</div>

<script>
    function initKaTeX() {
        if (typeof renderMathInElement === "function") {
            renderMathInElement(document.body, {
                delimiters: [
                    {left: '$$', right: '$$', display: true},
                    {left: '$', right: '$', display: false}
                ],
                throwOnError: false
            });
        }
    }

    document.getElementById('loginForm').addEventListener('submit', function(event) {
        event.preventDefault();
        const id = document.getElementById('username').value.trim();
        const pw = document.getElementById('password').value.trim();
        if (id === "MathPhysicsSociety" && pw === "asf123") {
            showScreen('screen-subject');
        } else {
            document.getElementById('login-error').style.display = "block";
        }
    });

    function logout() { showScreen('screen-login'); }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
        initKaTeX();
    }

    let currentSubject = '';
    let currentUnit = 0;

    function selectSubject(subject) {
        currentSubject = subject;
        const unitContainer = document.getElementById('unit-buttons');
        unitContainer.innerHTML = '';
        
        const units = subject === 'calc' 
            ? ["Limits & Continuity", "Differentiation Rules", "Composite & Inverse", "Contextual Apps", "Analytical Apps", "Integration", "Diff Equations", "Apps of Integration"]
            : ["Vectors", "Kinematics", "Newton's Laws of Motion", "Work, Energy & Power", "Momentum", "Rotation", "Oscillations"];

        units.forEach((u, i) => {
            const unitNum = subject === 'physics' ? i : i + 1;
            unitContainer.innerHTML += `<button class="btn btn-subject" onclick="showSummary('${subject}', ${unitNum})">Unit ${unitNum}: ${u}</button>`;
        });
        showScreen('screen-unit');
    }

    // CALCULUS DATA
    const calcData = {
        1: `<h3>Unit 1: Limits and Continuity</h3>
            <p><strong>Core Concept:</strong> Definition of limits, limit laws, continuity conditions, and the Intermediate Value Theorem (IVT).</p>
            $$\\lim_{x \\to c} f(x) = L$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$x \\to c$: $x$ approaches constant $c$<br>$L$: Finite limit value</div>`,
        2: `<h3>Unit 2: Differentiation Rules</h3>
            <p><strong>Core Concept:</strong> Power, Product, Quotient rules, and derivatives of exponential/trig functions.</p>
            $$\\frac{d}{dx}[x^n] = n x^{n-1}, \\quad \\frac{d}{dx}[f\\cdot g] = f'g + fg'$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\frac{d}{dx}$: Derivative with respect to $x$<br>$f', g'$: First derivatives</div>`,
        3: `<h3>Unit 3: Composite, Implicit, & Inverse Functions</h3>
            <p><strong>Core Concept:</strong> Chain Rule, Implicit Differentiation, and derivatives of inverse trig functions.</p>
            $$\\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$g(x)$: Inner function<br>$f'(g(x))$: Outer derivative evaluated at inner</div>`,
        4: `<h3>Unit 4: Contextual Applications of Differentiation</h3>
            <p><strong>Core Concept:</strong> Related rates, straight-line motion (velocity & acceleration), and local linearity.</p>
            $$v(t) = s'(t), \\quad a(t) = v'(t) = s''(t)$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$s(t)$: Position<br>$v(t)$: Velocity<br>$a(t)$: Acceleration</div>`,
        5: `<h3>Unit 5: Analytical Applications of Differentiation</h3>
            <p><strong>Core Concept:</strong> Mean Value Theorem (MVT), Extreme Value Theorem (EVT), concavity, and optimization.</p>
            $$f'(c) = \\frac{f(b) - f(a)}{b - a}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$c$: Point in interval $(a,b)$<br>$f'(c)$: Average rate of change slope</div>`,
        6: `<h3>Unit 6: Integration and Accumulation of Change</h3>
            <p><strong>Core Concept:</strong> Riemann sums, Fundamental Theorem of Calculus (FTC), and u-substitution.</p>
            $$\\int_a^b f(x)\\,dx = F(b) - F(a)$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$F(x)$: Antiderivative of $f(x)$<br>$a, b$: Lower and upper limits</div>`,
        7: `<h3>Unit 7: Differential Equations</h3>
            <p><strong>Core Concept:</strong> Slope fields, separable differential equations, and exponential growth/decay models.</p>
            $$\\frac{dy}{dt} = ky \\implies y = C e^{kt}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$k$: Growth constant<br>$C$: Initial value constant</div>`,
        8: `<h3>Unit 8: Applications of Integration</h3>
            <p><strong>Core Concept:</strong> Area between curves, average value of a function, and volumes of solids of revolution.</p>
            $$V = \\pi \\int_a^b [R(x)]^2\\,dx, \\quad f_{avg} = \\frac{1}{b-a}\\int_a^b f(x)\\,dx$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$R(x)$: Radius of cross-section<br>$f_{avg}$: Average height</div>`
    };

    // AP PHYSICS C DATA
    const physicsData = {
        0: `<h3>Unit 0: Vectors</h3>
            <p><strong>Core Concept:</strong> Vector representation in 2D/3D space, components, dot product (scalar result), and cross product (vector result).</p>
            $$\\|\\vec{v}\\| = \\sqrt{v_x^2 + v_y^2}, \\quad \\theta = \\tan^{-1}\\left(\\frac{v_y}{v_x}\\right)$$
            $$\\vec{a} \\cdot \\vec{b} = |\\vec{a}||\\vec{b}|\\cos\\theta = a_x b_x + a_y b_y$$
            $$\\|\\vec{a} \\times \\vec{b}\\| = |\\vec{a}||\\vec{b}|\\sin\\theta$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\vec{v}$: Vector quantity<br>$\\theta$: Angle between vectors<br>$\\cdot$: Scalar dot product<br>$\\times$: Vector cross product</div>`,
        1: `<h3>Unit 1: Kinematics</h3>
            <p><strong>Core Concept:</strong> Calculus-based 1D and 2D motion, graphic relationships, projectile motion, and resistive motion with variable acceleration.</p>
            $$v = \\frac{dx}{dt}, \\quad a = \\frac{dv}{dt} = \\frac{d^2x}{dt^2}$$
            $$x = x_0 + v_0 t + \\frac{1}{2}at^2, \\quad v^2 = v_0^2 + 2a\\Delta x$$
            $$a_{\\text{incline}} = g \\sin\\theta$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$x, v, a$: Position, velocity, acceleration<br>$g$: Acceleration due to gravity ($9.8\\text{ m/s}^2$)<br>$\\theta$: Angle of inclination</div>`,
        2: `<h3>Unit 2: Newton's Laws of Motion</h3>
            <p><strong>Core Concept:</strong> Forces, free-body diagrams, friction, drag forces (terminal velocity), Atwood machines, and uniform/non-uniform circular motion.</p>
            $$\\sum \\vec{F} = m\\vec{a}, \\quad F_s = -kx$$
            $$f_k = \\mu_k F_N, \\quad f_{s,\\text{max}} = \\mu_s F_N$$
            $$a_c = \\frac{v^2}{r} = \\omega^2 r, \\quad v_T = \\frac{mg}{b}\\text{ or }\\sqrt{\\frac{2mg}{C\\rho A}}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\mu$: Coefficient of friction<br>$F_N$: Normal force<br>$a_c$: Centripetal acceleration<br>$v_T$: Terminal velocity</div>`,
        3: `<h3>Unit 3: Work, Energy, and Power</h3>
            <p><strong>Core Concept:</strong> Work-Energy Theorem, conservative vs. non-conservative forces, potential energy functions, and instantaneous power.</p>
            $$W = \\int \\vec{F} \\cdot d\\vec{r} = \\Delta K, \\quad K = \\frac{1}{2}m v^2$$
            $$F(x) = -\\frac{dU}{dx}, \\quad P = \\frac{dW}{dt} = \\vec{F} \\cdot \\vec{v}$$
            $$\\Delta E_{\\text{th}} = f_k \\Delta s$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$W$: Work done<br>$K$: Kinetic energy<br>$U$: Potential energy<br>$P$: Power<br>$E_{\\text{th}}$: Thermal energy</div>`,
        4: `<h3>Unit 4: Systems of Particles & Linear Momentum</h3>
            <p><strong>Core Concept:</strong> Center of mass, impulse-momentum theorem, and conservation of linear momentum in collisions.</p>
            $$\\vec{r}_{cm} = \\frac{\\int \\vec{r}\\,dm}{M}, \\quad \\vec{J} = \\int \\vec{F}\\,dt = \\Delta \\vec{p}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\vec{r}_{cm}$: Center of mass<br>$\\vec{J}$: Impulse<br>$\\vec{p}$: Linear momentum ($m\\vec{v}$)</div>`,
        5: `<h3>Unit 5: Rotation</h3>
            <p><strong>Core Concept:</strong> Rotational kinematics, moment of inertia, rotational dynamics, torque, and angular momentum.</p>
            $$\\vec{\\tau} = \\vec{r} \\times \\vec{F} = I\\vec{\\alpha}, \\quad I = \\int r^2\\,dm, \\quad \\vec{L} = I\\vec{\\omega}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\tau$: Torque<br>$I$: Moment of inertia<br>$\\alpha$: Angular acceleration<br>$L$: Angular momentum</div>`,
        6: `<h3>Unit 6: Oscillations</h3>
            <p><strong>Core Concept:</strong> Simple harmonic motion (SHM), physical pendulums, spring systems, and second-order differential equations of motion.</p>
            $$\\frac{d^2x}{dt^2} = -\\omega^2 x, \\quad T = 2\\pi\\sqrt{\\frac{m}{k}}$$
            <div class="symbol-key"><strong>Symbol Key:</strong><br>$\\omega$: Angular frequency<br>$T$: Period of oscillation</div>`
    };

    function showSummary(subject, unitNum) {
        currentSubject = subject;
        currentUnit = unitNum;
        document.getElementById('summary-title').innerText = `${subject === 'calc' ? 'AP Calculus AB' : 'AP Physics C'} - Unit ${unitNum}`;
        document.getElementById('summary-content').innerHTML = (subject === 'calc' ? calcData[unitNum] : physicsData[unitNum]) || "<p>Detailed Summary Content...</p>";
        showScreen('screen-summary');
    }

    // PRACTICE ENGINE
    let activeQuestions = [];
    let currentQIndex = 0;

    function startPractice(mode) {
        if (currentSubject === 'physics') {
            if (mode === 'MCQ') {
                activeQuestions = [
                    {
                        title: "Unit 0 - MCQ 1: Vector Dot Product",
                        text: "A force vector $\\vec{F} = (3\\hat{i} + 4\\hat{j})\\text{ N}$ acts on a particle, displacing it by $\\vec{d} = (2\\hat{i} - 1\\hat{j})\\text{ m}$. What is the work done by the force?",
                        options: ["2 J", "10 J", "6 J", "14 J"],
                        correctIndex: 0,
                        hint: "Work is the dot product of force and displacement: $W = \\vec{F} \\cdot \\vec{d} = F_x d_x + F_y d_y$.",
                        explanation: "$W = (3)(2) + (4)(-1) = 6 - 4 = 2\\text{ J}$."
                    },
                    {
                        title: "Unit 1 - MCQ 2: Calculus Kinematics",
                        text: "The position of a particle along the x-axis is given by $x(t) = 2t^3 - 9t^2 + 12t$. At what time $t > 0$ is the particle momentarily at rest?",
                        options: ["t = 1 s and t = 2 s", "t = 3 s only", "t = 1.5 s only", "t = 2 s and t = 4 s"],
                        correctIndex: 0,
                        hint: "The particle is at rest when velocity $v(t) = \\frac{dx}{dt} = 0$.",
                        explanation: "$v(t) = 6t^2 - 18t + 12 = 6(t-1)(t-2) = 0 \\implies t = 1\\text{ s}, 2\\text{ s}$."
                    },
                    {
                        title: "Unit 1 - MCQ 3: Terminal Velocity",
                        text: "A ball of mass $m$ falls vertically under gravity while experiencing a resistive drag force $F_D = -bv$. What is its terminal velocity $v_T$?",
                        options: ["$v_T = \\frac{mg}{b}$", "$v_T = \\sqrt{\\frac{mg}{b}}$", "$v_T = \\frac{b}{mg}$", "$v_T = \\frac{mg}{2b}$"],
                        correctIndex: 0,
                        hint: "At terminal velocity, acceleration is zero, so net force $\\sum F = mg - bv_T = 0$.",
                        explanation: "When $a = 0$, $mg - bv_T = 0 \\implies v_T = \\frac{mg}{b}$."
                    },
                    {
                        title: "Unit 2 - MCQ 4: Inclined Plane with Friction",
                        text: "A block of mass $m$ slides down an incline of angle $\\theta$ with constant velocity. What is the coefficient of kinetic friction $\\mu_k$ between the block and the incline?",
                        options: ["$\\tan\\theta$", "$\\sin\\theta$", "$\\cos\\theta$", "$\\mu_k = 1$"],
                        correctIndex: 0,
                        hint: "Constant velocity means $a = 0$. Balance components: $mg\\sin\\theta = f_k = \\mu_k mg\\cos\\theta$.",
                        explanation: "$mg\\sin\\theta = \\mu_k mg\\cos\\theta \\implies \\mu_k = \\frac{\\sin\\theta}{\\cos\\theta} = \\tan\\theta$."
                    },
                    {
                        title: "Unit 2 - MCQ 5: Vertical Circle Critical Speed",
                        text: "A roller coaster car goes through a vertical loop of radius $R$. What is the minimum speed $v_{\\text{min}}$ at the top of the loop so that the car maintains contact with the track?",
                        options: ["$\\sqrt{gR}$", "$\\sqrt{2gR}$", "$gR$", "$\\frac{1}{2}gR$"],
                        correctIndex: 0,
                        hint: "At the minimum (critical) speed, the normal force becomes zero ($F_N = 0$) at the top point.",
                        explanation: "$\\sum F_c = F_N + mg = \\frac{mv^2}{R}$. Setting $F_N = 0$ gives $mg = \\frac{mv^2}{R} \\implies v = \\sqrt{gR}$."
                    },
                    {
                        title: "Unit 3 - MCQ 6: Force from Potential Energy",
                        text: "The potential energy function of a conservative system is given by $U(x) = 4x^3 - 5x$. What is the force $F(x)$ acting on the particle at $x = 2\\text{ m}$?",
                        options: ["-43 N", "43 N", "-27 N", "37 N"],
                        correctIndex: 0,
                        hint: "Force and potential energy are related by $F(x) = -\\frac{dU}{dx}$.",
                        explanation: "$F(x) = -\\frac{d}{dx}(4x^3 - 5x) = -(12x^2 - 5)$. At $x = 2$, $F(2) = -(12(4) - 5) = -43\\text{ N}$."
                    }
                ];
            } else {
                activeQuestions = [
                    {
                        title: "Unit 1 & 2 - FRQ 1: Resistive Force & Differential Equations",
                        text: "A projectile of mass $m = 2.0\\text{ kg}$ is dropped from rest in a viscous fluid that exerts a drag force $F_D = -4v$.<br><br>" +
                              "<b>(a)</b> Write the differential equation for the velocity $v(t)$ of the object.<br>" +
                              "<b>(b)</b> Derive the expression for $v(t)$ as an explicit function of time.<br>" +
                              "<b>(c)</b> Calculate the numerical terminal velocity of the object (take $g = 9.8\\text{ m/s}^2$).",
                        options: ["View Multi-part Solution below"],
                        correctIndex: 0,
                        hint: "Use Newton's 2nd Law: $m\\frac{dv}{dt} = mg - bv$. Separate variables and integrate.",
                        explanation: "<b>(a)</b> $2\\frac{dv}{dt} = 2(9.8) - 4v \\implies \\frac{dv}{dt} = 9.8 - 2v$.<br>" +
                                     "<b>(b)</b> $\\int_0^v \\frac{dv}{9.8 - 2v} = \\int_0^t dt \\implies -\\frac{1}{2}\\ln\\left(\\frac{9.8-2v}{9.8}\\right) = t \\implies v(t) = 4.9(1 - e^{-2t})\\text{ m/s}$.<br>" +
                                     "<b>(c)</b> As $t \\to \\infty$, $v_T = 4.9\\text{ m/s}$ (or $v_T = \\frac{mg}{b} = \\frac{2(9.8)}{4} = 4.9\\text{ m/s}$)."
                    },
                    {
                        title: "Unit 2 & 3 - FRQ 2: Block-Spring System on Incline",
                        text: "A block of mass $m = 3.0\\text{ kg}$ is placed against a compressed spring ($k = 600\\text{ N/m}$) on an incline of angle $\\theta = 30^\\circ$. The spring is compressed by $x = 0.4\\text{ m}$ from its equilibrium and released.<br><br>" +
                              "<b>(a)</b> If the incline is frictionless, find the total distance $d$ the block travels up the incline before coming to rest.<br>" +
                              "<b>(b)</b> If coefficient of kinetic friction is $\\mu_k = 0.2$, calculate the new maximum distance $d'$ traveled up the incline.",
                        options: ["View Multi-part Solution below"],
                        correctIndex: 0,
                        hint: "Apply Conservation of Mechanical Energy: $E_i = E_f$. In part (b), include work done by friction $W_f = f_k d = (\\mu_k mg \\cos\\theta) d$.",
                        explanation: "<b>(a)</b> $\\frac{1}{2}kx^2 = mg h = mg(d \\sin 30^\\circ)$.<br>" +
                                     "$\\frac{1}{2}(600)(0.4)^2 = (3.0)(9.8)(0.5)d \\implies 48 = 14.7 d \\implies d \\approx 3.27\\text{ m}$.<br><br>" +
                                     "<b>(b)</b> $\\frac{1}{2}kx^2 = mg(d' \\sin 30^\\circ) + \\mu_k mg \\cos 30^\\circ d'$.<br>" +
                                     "$48 = 14.7 d' + (0.2)(3.0)(9.8)(0.866)d' = 14.7 d' + 5.09 d' = 19.79 d' \\implies d' \\approx 2.43\\text{ m}$."
                    }
                ];
            }
        } else {
            activeQuestions = [
                {
                    title: "Calculus Unit 1 - MCQ 1",
                    text: "Evaluate $\\lim_{x \\to 0} \\frac{\\sin(5x)}{x}$.",
                    options: ["5", "1", "0", "Undefined"],
                    correctIndex: 0,
                    hint: "Use L'Hôpital's Rule or standard limit $\\lim_{u \\to 0}\\frac{\\sin u}{u} = 1$.",
                    explanation: "$\\lim_{x \\to 0} \\frac{5\\cos(5x)}{1} = 5$."
                }
            ];
        }

        showScreen('screen-practice');
        loadQuestion(0);
    }

    function loadQuestion(index) {
        currentQIndex = index;
        const q = activeQuestions[index];
        document.getElementById('question-progress').innerText = `Question ${index + 1} of ${activeQuestions.length}`;
        document.getElementById('q-title').innerText = q.title;
        document.getElementById('q-text').innerHTML = q.text;

        const mcqBox = document.getElementById('mcq-options-container');
        mcqBox.innerHTML = '';
        q.options.forEach((opt, idx) => {
            mcqBox.innerHTML += `<button class="option-btn" onclick="selectOption(${idx})">${String.fromCharCode(65 + idx)}. ${opt}</button>`;
        });
        document.getElementById('hint-card').style.display = 'none';
        document.getElementById('explain-card').style.display = 'none';
        initKaTeX();
    }

    function selectOption(idx) {
        const btns = document.querySelectorAll('.option-btn');
        btns.forEach((b, i) => {
            b.classList.remove('selected');
            if (i === idx) b.classList.add('selected');
        });
    }

    function toggleHint() {
        const card = document.getElementById('hint-card');
        card.innerHTML = `<strong>Hint:</strong> ${activeQuestions[currentQIndex].hint}`;
        card.style.display = 'block';
        initKaTeX();
    }

    function checkAnswer() {
        const card = document.getElementById('explain-card');
        card.innerHTML = `<strong>Explanation:</strong><br>${activeQuestions[currentQIndex].explanation}`;
        card.style.display = 'block';
        initKaTeX();
    }

    function prevQuestion() { if(currentQIndex > 0) loadQuestion(currentQIndex - 1); }
    function nextQuestion() { if(currentQIndex < activeQuestions.length - 1) loadQuestion(currentQIndex + 1); }
</script>

</body>
</html>
