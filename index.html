<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math & Physics Society Guidebook</title>
    
    <!-- KaTeX CSS & JS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            color: #333;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 850px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .screen { display: none; }
        .active { display: block; }

        .btn {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            border-radius: 8px;
            cursor: pointer;
            margin: 6px 5px 6px 0;
            transition: background 0.2s;
            text-align: left;
            width: 100%;
        }
        .btn:hover { background-color: #004b99; }
        .btn-subject { font-size: 18px; text-align: center; }
        .btn-back { background-color: #6c757d; text-align: center; width: auto; }
        .btn-back:hover { background-color: #5a6268; }

        .login-box { max-width: 350px; margin: 40px auto; text-align: center; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        .error-msg { color: #dc3545; display: none; margin-top: 10px; font-size: 14px; }
        
        .summary-card {
            background: #f8f9fa;
            border-left: 5px solid #0066cc;
            padding: 20px;
            margin-top: 20px;
            border-radius: 4px;
            line-height: 1.7;
        }
        .summary-card h3 { color: #0066cc; margin-top: 0; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
        .summary-card h4 { margin-bottom: 5px; color: #444; }
        .exam-tip {
            background-color: #fff3cd;
            border: 1px solid #ffeeba;
            color: #856404;
            padding: 12px 15px;
            border-radius: 6px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="container">

    <!-- 1. Login Screen -->
    <div id="screen-login" class="screen active">
        <div class="login-box">
            <h2>🔒 Member Login</h2>
            <form onsubmit="handleLogin(event)">
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" id="username" required placeholder="Enter Username">
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" id="password" required placeholder="Enter Password">
                </div>
                <button type="submit" class="btn btn-subject" style="width: 100%;">Sign In</button>
                <p id="login-error" class="error-msg">Invalid Username or Password.</p>
            </form>
        </div>
    </div>

    <!-- 2. Subject Selection Screen -->
    <div id="screen-subject" class="screen">
        <h2>📚 Select Course</h2>
        <p>Select a course syllabus to review key concepts & formulas.</p>
        <button class="btn btn-subject" onclick="selectSubject('calc')">📐 AP Calculus AB</button>
        <button class="btn btn-subject" onclick="selectSubject('physics')">⚡ AP Physics C: Mechanics</button>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="logout()">Log Out</button>
        </div>
    </div>

    <!-- 3. Unit Selection Screen -->
    <div id="screen-unit" class="screen">
        <h2 id="subject-title">Subject Title</h2>
        <p>Select a Unit from syllabus:</p>
        <div id="unit-buttons"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-subject')">← Back to Courses</button>
        </div>
    </div>

    <!-- 4. Summary Screen -->
    <div id="screen-summary" class="screen">
        <h2 id="summary-title">Unit Summary</h2>
        <div id="summary-content" class="summary-card"></div>
        <div style="margin-top: 20px;">
            <button class="btn btn-back" onclick="showScreen('screen-unit')">← Back to Syllabus Units</button>
        </div>
    </div>

</div>

<script>
    function handleLogin(event) {
        event.preventDefault();
        const id = document.getElementById('username').value;
        const pw = document.getElementById('password').value;
        const errorMsg = document.getElementById('login-error');

        if (id === "MathPhysicsSociety" && pw === "asf123") {
            errorMsg.style.display = "none";
            showScreen('screen-subject');
        } else {
            errorMsg.style.display = "block";
        }
    }

    function logout() {
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        showScreen('screen-login');
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    let currentSubject = '';

    function selectSubject(subject) {
        currentSubject = subject;
        const unitContainer = document.getElementById('unit-buttons');
        unitContainer.innerHTML = '';

        if (subject === 'calc') {
            document.getElementById('subject-title').innerText = "📐 AP Calculus AB";
            const units = [
                "Unit 1: Limits and Continuity",
                "Unit 2: Differentiation, definition and rules",
                "Unit 3: Differentiating composite and inverse functions",
                "Unit 4: Contextual applications of differentiation",
                "Unit 5: Applying derivatives to analyze functions",
                "Unit 6: Integration and Accumulation of Change",
                "Unit 7: Differential Equations",
                "Unit 8: Applications of integration",
                "Unit 9: Course review and exam preparation"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('calc', ${index + 1})">${u}</button>`;
            });
        } else if (subject === 'physics') {
            document.getElementById('subject-title').innerText = "⚡ AP Physics C: Mechanics";
            const units = [
                "Unit 1: Kinematics",
                "Unit 2: Force and Dynamics",
                "Unit 3: Work, Energy and Power",
                "Unit 4: Linear Momentum",
                "Unit 5: Torque and Rotational Dynamics",
                "Unit 6: Energy and Momentum of Rotating Systems",
                "Unit 7: Oscillations"
            ];
            units.forEach((u, index) => {
                unitContainer.innerHTML += `<button class="btn" onclick="showSummary('physics', ${index + 1})">${u}</button>`;
            });
        }
        showScreen('screen-unit');
    }

    const calcData = {
        1: `<h3>Unit 1: Limits and Continuity</h3>
            <h4>1. Limit Definition & One-Sided Limits</h4>
            <p>$$\\lim_{x \\to c^-} f(x) = \\lim_{x \\to c^+} f(x) = L \\iff \\lim_{x \\to c} f(x) = L$$</p>
            <h4>2. Continuity (3-Part Test)</h4>
            <p>$f(c)$ is defined, $\\lim_{x \\to c} f(x)$ exists, and $\\lim_{x \\to c} f(x) = f(c)$.</p>
            <h4>3. Intermediate Value Theorem (IVT)</h4>
            <p>If $f(x)$ is continuous on $[a,b]$, $f(x)$ takes all values between $f(a)$ and $f(b)$.</p>
            <div class="exam-tip"><strong>💡 AP Exam Tip:</strong> State "continuous on $[a,b]$" before applying IVT!</div>`,
        2: `<h3>Unit 2: Differentiation: Definition and Rules</h3>
            <h4>1. Limit Definition of Derivative</h4>
            <p>$$f'(x) = \\lim_{h \\to 0} \\frac{f(x+h) - f(x)}{h}$$</p>
            <h4>2. Basic Rules</h4>
            <p><strong>Power Rule:</strong> $\\frac{d}{dx}[x^n] = n x^{n-1}$</p>
            <p><strong>Product Rule:</strong> $\\frac{d}{dx}[u v] = u'v + uv'$</p>
            <p><strong>Quotient Rule:</strong> $\\frac{d}{dx}\\left[\\frac{u}{v}\\right] = \\frac{u'v - uv'}{v^2}$</p>`,
        3: `<h3>Unit 3: Composite, Implicit & Inverse Functions</h3>
            <h4>1. Chain Rule</h4>
            <p>$$\\frac{d}{dx}[f(g(x))] = f'(g(x)) \\cdot g'(x)$$</p>
            <h4>2. Implicit Differentiation</h4>
            <p>Differentiate both sides with respect to $x$, using Chain Rule for $y$ terms ($\\frac{dy}{dx}$).</p>
            <h4>3. Derivative of Inverse Functions</h4>
            <p>$$(f^{-1})'(a) = \\frac{1}{f'(f^{-1}(a))}$$</p>`,
        4: `<h3>Unit 4: Contextual Applications of Differentiation</h3>
            <h4>1. Position, Velocity, Acceleration</h4>
            <p>$$v(t) = s'(t), \\quad a(t) = v'(t) = s''(t)$$</p>
            <p>Speed is $|v(t)|$. Speed increases if $v(t)$ and $a(t)$ have the <strong>same sign</strong>.</p>
            <h4>2. Related Rates</h4>
            <p>Differentiate with respect to time $t$, substitute known values, and solve for the target rate.</p>`,
        5: `<h3>Unit 5: Applying Derivatives to Analyze Functions</h3>
            <h4>1. Extreme Value Theorem (EVT) & Critical Points</h4>
            <p>Critical points occur where $f'(x) = 0$ or $f'(x)$ is undefined.</p>
            <h4>2. First & Second Derivative Tests</h4>
            <p>$f'(x) > 0 \\implies$ Increasing | $f''(x) > 0 \\implies$ Concave Up</p>
            <p>Point of Inflection occurs where $f''(x)$ changes sign.</p>`,
        6: `<h3>Unit 6: Integration and Accumulation of Change</h3>
            <h4>1. Fundamental Theorem of Calculus (FTC)</h4>
            <p><strong>Part 1:</strong> $\\frac{d}{dx} \\int_{a}^{x} f(t) dt = f(x)$</p>
            <p><strong>Part 2:</strong> $\\int_{a}^{b} f(x) dx = F(b) - F(a)$</p>
            <h4>2. u-Substitution</h4>
            <p>Used to reverse the Chain Rule for integration.</p>`,
        7: `<h3>Unit 7: Differential Equations</h3>
            <h4>1. Separation of Variables</h4>
            <p>Separate variables $y$ on left and $x$ on right: $\\int g(y) dy = \\int f(x) dx + C$.</p>
            <h4>2. Exponential Growth/Decay</h4>
            <p>$$\\frac{dy}{dt} = ky \\implies y(t) = y_0 e^{kt}$$</p>`,
        8: `<h3>Unit 8: Applications of Integration</h3>
            <h4>1. Area Between Curves</h4>
            <p>$$A = \\int_{a}^{b} (f(x) - g(x)) dx$$</p>
            <h4>2. Volume (Disc & Washer Methods)</h4>
            <p>Disc: $V = \\pi \\int [R(x)]^2 dx$ | Washer: $V = \\pi \\int ([R(x)]^2 - [r(x)]^2) dx$</p>`,
        9: `<h3>Unit 9: Course Review and Exam Preparation</h3>
            <h4>Exam Strategy Checklist:</h4>
            <ul>
                <li>Always justify using theorems (IVT, EVT, MVT) by verifying continuity/differentiability first.</li>
                <li>Store functions in your graphing calculator to avoid rounding errors.</li>
                <li>Units matter on FRQs (e.g., $ft/sec^2$, $gallons/hour$).</li>
            </ul>`
    };

    const physicsData = {
        1: `<h3>Unit 1: Kinematics</h3>
            <h4>Calculus Relations</h4>
            <p>$$v(t) = \\frac{dx}{dt}, \\quad a(t) = \\frac{dv}{dt} = \\frac{d^2x}{dt^2}$$</p>
            <p>$$x(t) = x_0 + \\int v(t) dt, \\quad v(t) = v_0 + \\int a(t) dt$$</p>
            <div class="exam-tip"><strong>💡 AP Tip:</strong> Acceleration is rarely constant in AP Physics C! Integrate $a(t)$ to find velocity.</div>`,
        2: `<h3>Unit 2: Force and Dynamics</h3>
            <h4>1. Newton's 2nd Law (Differential Form)</h4>
            <p>$$\\vec{F}_{net} = \\frac{d\\vec{p}}{dt} = m\\vec{a}$$</p>
            <h4>2. Drag Force & Terminal Velocity</h4>
            <p>When $F_{drag} = -bv$, Terminal velocity occurs when $F_{net} = 0 \\implies mg - bv_T = 0$.</p>`,
        3: `<h3>Unit 3: Work, Energy and Power</h3>
            <h4>1. Work Integrals</h4>
            <p>$$W = \\int_{x_1}^{x_2} F(x) dx, \\quad F(x) = -\\frac{dU}{dx}$$</p>
            <h4>2. Power</h4>
            <p>$$P = \\frac{dW}{dt} = \\vec{F} \\cdot \\vec{v}$$</p>`,
        4: `<h3>Unit 4: Linear Momentum</h3>
            <h4>1. Impulse-Momentum Theorem</h4>
            <p>$$\\vec{J} = \\int \\vec{F} dt = \\Delta \\vec{p}$$</p>
            <h4>2. Center of Mass</h4>
            <p>$$x_{cm} = \\frac{1}{M} \\int x dm$$</p>`,
        5: `<h3>Unit 5: Torque and Rotational Dynamics</h3>
            <h4>1. Rotational Kinematics & Torque</h4>
            <p>$$\\vec{\\tau} = \\vec{r} \\times \\vec{F}, \\quad \\tau_{net} = I \\alpha$$</p>
            <h4>2. Moment of Inertia</h4>
            <p>$$I = \\int r^2 dm$$</p>`,
        6: `<h3>Unit 6: Energy and Momentum of Rotating Systems</h3>
            <h4>1. Rotational Kinetic Energy</h4>
            <p>$$K_{rot} = \\frac{1}{2}I \\omega^2$$</p>
            <h4>2. Angular Momentum Conservation</h4>
            <p>$$L = I \\omega, \\quad \\vec{L} = \\vec{r} \\times \\vec{p} \\implies \\tau_{net} = \\frac{dL}{dt}$$</p>`,
        7: `<h3>Unit 7: Oscillations</h3>
            <h4>Simple Harmonic Motion (SHM)</h4>
            <p>Differential Equation: $\\frac{d^2x}{dt^2} + \\omega^2 x = 0$</p>
            <p>Angular frequency for Mass-Spring: $\\omega = \\sqrt{\\frac{k}{m}}$, Period $T = 2\\pi \\sqrt{\\frac{m}{k}}$</p>`
    };

    function showSummary(subject, unitNum) {
        const titleEl = document.getElementById('summary-title');
        const contentEl = document.getElementById('summary-content');

        if (subject === 'calc') {
            titleEl.innerText = `AP Calculus AB - Unit ${unitNum}`;
            contentEl.innerHTML = calcData[unitNum] || "<p>Content updating...</p>";
        } else if (subject === 'physics') {
            titleEl.innerText = `AP Physics C - Unit ${unitNum}`;
            contentEl.innerHTML = physicsData[unitNum] || "<p>Content updating...</p>";
        }

        showScreen('screen-summary');
        
        if (window.renderMathInElement) {
            renderMathInElement(document.body);
        }
    }
</script>

</body>
</html>
